name: "Build kernels"

env:
  CONFIGURATION: "repos.json"
  OUT_DIR: "out"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Set-repos:
    name: "Parse repos.json"
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.generate-matrix.outputs.repos }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Generate Matrix"
        id: generate-matrix
        shell: bash
        run: |
          {
            echo "repos<<EOF"
            cat "${{ env.CONFIGURATION }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  Build-Kernel:
    name: "Build kernel"
    runs-on: ubuntu-latest
    needs:
      - Set-repos
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        repos: ${{ fromJSON(needs.Set-repos.outputs.repos) }}
    env:
      kernelDir: ${{ format('{0}_{1}', matrix.repos.kernelSource.name, matrix.repos.kernelSource.device) }}
      kernelName: ${{ matrix.repos.kernelSource.name }}
      kernelRepo: ${{ matrix.repos.kernelSource.repo }}
      kernelBranch: ${{ matrix.repos.kernelSource.branch }}
      kernelDevice: ${{ matrix.repos.kernelSource.device }}
      DEFCONFIG_NAME: ${{ matrix.repos.defconfig }}
      withKernelSU: ${{ matrix.repos.withKernelSU }}
      ksuVersion: ${{ matrix.repos.ksuVersion }}
      ARCH_BOOT: arm64

    steps:
      - name: "Create working dir"
        shell: bash
        run: mkdir -p "${{ env.kernelDir }}"

      - name: "Install prerequisites"
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc curl git zip ftp gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev lftp zstd wget libfl-dev python3 python-is-python3 libarchive-tools cpio flex bison

      - name: "Clone kernel source"
        working-directory: ${{ github.workspace }}/${{ env.kernelDir }}
        shell: bash
        run: |
          git clone --recursive --branch "${{ env.kernelBranch }}" "${{ env.kernelRepo }}" "${{ env.kernelName }}" --depth=1

      - name: "Get toolchains"
        working-directory: ${{ github.workspace }}/${{ env.kernelDir }}
        shell: bash
        env:
          toolchains: ${{ toJSON(matrix.repos.toolchains) }}
        run: |
          mkdir -p toolchains
          echo "$toolchains" | jq -c '.[]' | while read -r tc; do
            repo=$(echo "$tc" | jq -r '.repo')
            branch=$(echo "$tc" | jq -r '.branch // empty')
            name=$(echo "$tc" | jq -r '.name')
            if [ -n "$branch" ]; then
              git clone --depth=1 --branch "$branch" "$repo" "toolchains/$name"
            else
              git clone --depth=1 "$repo" "toolchains/$name"
            fi
            # Toolchain layouts differ: proton-clang has bin/ at the repo root,
            # AOSP prebuilts nest it under clang-rXXXXXX/bin. Register every
            # bin dir found so the compilers/linkers land on PATH.
            find "$(pwd)/toolchains/$name" -maxdepth 3 -type d -name bin | while read -r binDir; do
              echo "$binDir" >> "$GITHUB_PATH"
              echo "PATH += $binDir"
            done
          done

      - name: "Set args"
        id: generate-args
        working-directory: ${{ github.workspace }}/${{ env.kernelDir }}/${{ env.kernelName }}
        shell: bash
        env:
          params: ${{ toJSON(matrix.repos.params) }}
        run: |
          get_param() { echo "$params" | jq -r --arg k "$1" '.[$k] // empty'; }

          args="-j$(nproc --all)"
          if [ -n "${{ env.OUT_DIR }}" ]; then
            mkdir -p "$(pwd)/${{ env.OUT_DIR }}"
            args="${args} O=$(pwd)/${{ env.OUT_DIR }}"
          fi

          # Emit every parameter as VAR=value on the make command line.
          # Array-valued params (e.g. LLVM) expand to multiple tokens.
          for key in $(echo "$params" | jq -r 'keys[]'); do
            val=$(get_param "$key")
            [ -n "$val" ] || continue
            if echo "$val" | jq empty >/dev/null 2>&1; then
              for item in $(echo "$val" | jq -r '.[]'); do
                args="${args} ${key}=${item}"
              done
            else
              args="${args} ${key}=${val}"
            fi
          done

          echo "args=${args}" >> "$GITHUB_OUTPUT"
          echo "Final make args: ${args}"

      - name: "Update KernelSU"
        if: ${{ env.withKernelSU == 'true' }}
        working-directory: ${{ github.workspace }}/${{ env.kernelDir }}/${{ env.kernelName }}
        shell: bash
        run: |
          if [ -d "./KernelSU" ]; then
            rm -rf "./KernelSU"
          fi
          if [ -d "./drivers/kernelsu" ]; then
            rm -rf "./drivers/kernelsu"
          fi

          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s "${{ env.ksuVersion }}"

          ls -la ./drivers/kernelsu || true
          # Verify the KernelSU driver is actually wired into the tree.
          grep -q "config KSU" ./drivers/kernelsu/Kconfig
          echo "KernelSU-Next ${{ env.ksuVersion }} wired into drivers/kernelsu"

      - name: "Make defconfig"
        working-directory: ${{ github.workspace }}/${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        shell: bash
        run: |
          command -v clang || { echo "FATAL: clang not on PATH"; ls -R ../toolchains | head -40; exit 1; }
          command -v ld.lld || { echo "FATAL: ld.lld not on PATH"; ls -R ../toolchains | head -40; exit 1; }
          make ${args} ${{ env.DEFCONFIG_NAME }}
          grep -E "CONFIG_LOCALVERSION=|CONFIG_LTO|CONFIG_KPROBES|CONFIG_KSU=|CONFIG_KSU_SUSFS=" "${{ env.OUT_DIR }}/.config" || true

      - name: "Build kernel"
        working-directory: ${{ github.workspace }}/${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        shell: bash
        run: |
          set -o pipefail
          make ${args} 2>&1 | tail -n 120
          test -f "${{ env.OUT_DIR }}/arch/${{ env.ARCH_BOOT }}/boot/Image" || { echo "Image missing - build failed"; exit 1; }

      - name: "Assemble AnyKernel3 flashable zip"
        shell: bash
        run: |
          AK3="${{ env.kernelDir }}/AnyKernel3"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$AK3"
          rm -rf "$AK3/.git" "$AK3/.github" "$AK3/README.md" "$AK3/anykernel.sh"

          cp "${{ env.kernelDir }}/${{ env.kernelName }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH_BOOT }}/boot/Image" "$AK3/Image"

          DTB="${{ env.kernelDir }}/${{ env.kernelName }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH_BOOT }}/boot/dtb"
          if [ -f "$DTB" ]; then
            cp "$DTB" "$AK3/dtb"
          fi

          cat > "$AK3/anykernel.sh" <<'EOF'
          # AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ## AnyKernel setup
          # global properties
          properties() { '
          kernel.string=SuiKernelNethunter-GKI-rock (KernelSU-Next + SUSFS)
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=
          supported.versions=
          supported.patchlevels=
          '; } # end properties

          # boot files attributes
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          } # end attributes

          # boot shell variables
          BLOCK=auto;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install
          write_boot;
          ## end boot install
          EOF

          cd "$AK3"
          ZIPNAME="SuiKernelNethunter-rock-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../$ZIPNAME" .
          cd ../..
          cp "${{ env.kernelDir }}/$ZIPNAME" .
          sha256sum "$ZIPNAME" > "$ZIPNAME.sha256"
          echo "AK3ZIP=$ZIPNAME" >> "$GITHUB_ENV"

      - name: "Upload kernel Image"
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ env.kernelDevice }}-${{ env.kernelName }}-${{ env.kernelBranch }}
          path: ${{ env.kernelDir }}/${{ env.kernelName }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH_BOOT }}/boot/Image
          if-no-files-found: error
          retention-days: 7

      - name: "Upload Image.gz"
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-${{ env.kernelDevice }}-${{ env.kernelName }}-${{ env.kernelBranch }}
          path: ${{ env.kernelDir }}/${{ env.kernelName }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH_BOOT }}/boot/Image.gz
          if-no-files-found: ignore
          retention-days: 7

      - name: "Upload dtb"
        uses: actions/upload-artifact@v4
        with:
          name: dtb-${{ env.kernelDevice }}-${{ env.kernelName }}-${{ env.kernelBranch }}
          path: ${{ env.kernelDir }}/${{ env.kernelName }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH_BOOT }}/boot/dtb
          if-no-files-found: ignore
          retention-days: 7

      - name: "Upload AnyKernel3 flashable zip"
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-${{ env.kernelDevice }}-${{ env.kernelName }}-${{ env.kernelBranch }}
          path: |
            ${{ env.AK3ZIP }}
            ${{ env.AK3ZIP }}.sha256
          if-no-files-found: error
          retention-days: 7

      - name: "Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rock-${{ github.run_number }}
          name: SuiKernelNethunter rock build ${{ github.run_number }}
          body: |
            Automated GKI build for rock (Poco M5 / Redmi 11 Prime 5G)
            - Kernel: ${{ env.kernelRepo }} (${{ env.kernelBranch }})
            - KernelSU-Next: ${{ env.ksuVersion }} + SUSFS
            - Defconfig: ${{ env.DEFCONFIG_NAME }}

            **Install**: flash `AnyKernel3-*.zip` in recovery, or unpack and re-pack `Image` into your boot image.
          files: |
            ${{ env.AK3ZIP }}
            ${{ env.AK3ZIP }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
