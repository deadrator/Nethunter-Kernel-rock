name: "Build kernels"

env:
  CONFIGURATION: "repos.json"
  OUT_DIR: "out"

on:
  workflow_dispatch:

jobs:
  Set-repos:
    name: "Parse repos.json"
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.generate-matrix.outputs.repos }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Generate Matrix"
        id: generate-matrix
        shell: bash
        run: |
          {
            echo "repos<<EOF"
            cat "${{ env.CONFIGURATION }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  Build-Kernel:
    name: "Build kernel"
    runs-on: ubuntu-latest
    needs:
      - Set-repos
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        repos: ${{ fromJSON(needs.Set-repos.outputs.repos) }}
    env:
      kernelDir: ${{ format('{0}_{1}', matrix.repos.kernelSource.name, matrix.repos.kernelSource.device) }}
      kernelName: ${{ matrix.repos.kernelSource.name }}
      kernelRepo: ${{ matrix.repos.kernelSource.repo }}
      kernelBranch: ${{ matrix.repos.kernelSource.branch }}
      kernelDevice: ${{ matrix.repos.kernelSource.device }}
      DEFCONFIG_NAME: ${{ matrix.repos.kernelSource.device }}_defconfig
      withKernelSU: ${{ matrix.repos.withKernelSU }}

    steps:
      - name: "Create working dir"
        shell: bash
        run: mkdir -p "${{ env.kernelDir }}"

      - name: "Install prerequisites"
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc curl git zip ftp gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev lftp zstd wget libfl-dev python2 python3 libarchive-tools

      - name: "Clone kernel source"
        working-directory: ${{ github.workspace }}/${{ env.kernelDir }}
        shell: bash
        run: |
          git clone --recursive --branch "${{ env.kernelBranch }}" "${{ env.kernelRepo }}" "${{ env.kernelName }}" --depth=1

      - name: "Get toolchains"
        working-directory: ${{ github.workspace }}/${{ env.kernelDir }}
        shell: bash
        env:
          toolchains: ${{ toJSON(matrix.repos.toolchains) }}
        run: |
          mkdir -p toolchains
          echo "$toolchains" | jq -c '.[]' | while read -r tc; do
            repo=$(echo "$tc" | jq -r '.repo')
            branch=$(echo "$tc" | jq -r '.branch')
            name=$(echo "$tc" | jq -r '.name')
            git clone --depth=1 --branch "$branch" "$repo" "toolchains/$name"
            echo "$(pwd)/toolchains/$name/bin" >> "$GITHUB_PATH"
          done
          echo "PATH Variable: $PATH"

      - name: "Set args"
        id: generate-args
        working-directory: ${{ github.workspace }}/${{ env.kernelDir }}/${{ env.kernelName }}
        shell: bash
        env:
          params: ${{ toJSON(matrix.repos.params) }}
          extraParams: ${{ toJSON(matrix.repos.extraParams) }}
        run: |
          ARCH=$(echo "$params" | jq -r '.ARCH // empty')
          CROSS_COMPILE=$(echo "$params" | jq -r '.CROSS_COMPILE // empty')
          CROSS_COMPILE_COMPAT=$(echo "$params" | jq -r '.CROSS_COMPILE_COMPAT // empty')
          CROSS_COMPILE_ARM32=$(echo "$params" | jq -r '.CROSS_COMPILE_ARM32 // empty')
          CLANG_TRIPLE=$(echo "$params" | jq -r '.CLANG_TRIPLE // empty')
          AR=$(echo "$params" | jq -r '.AR // empty')
          CC=$(echo "$params" | jq -r '.CC // empty')

          echo "ARCH=$ARCH" >> "$GITHUB_ENV"

          args="-j$(nproc --all)"
          if [ -n "${{ env.OUT_DIR }}" ]; then
            mkdir -p "$(pwd)/${{ env.OUT_DIR }}"
            args="${args} O=$(pwd)/${{ env.OUT_DIR }}"
          fi
          if [ -n "$ARCH" ]; then
            args="${args} ARCH=$ARCH"
          fi
          if [ -n "$CROSS_COMPILE" ]; then
            args="${args} CROSS_COMPILE=$CROSS_COMPILE"
          fi
          if [ -n "$CLANG_TRIPLE" ]; then
            args="${args} CLANG_TRIPLE=$CLANG_TRIPLE"
          fi
          if [ -n "$CROSS_COMPILE_COMPAT" ]; then
            args="${args} CROSS_COMPILE_ARM32=$CROSS_COMPILE_COMPAT"
          fi
          if [ -n "$AR" ]; then
            args="${args} AR=$AR"
          fi
          if [ -n "$CC" ]; then
            args="${args} CC=$CC"
          fi

          echo "args=$args" >> "$GITHUB_OUTPUT"

          extra_params=$(echo "$extraParams" | jq -r 'to_entries[] | select(.value != "") | "\(.key)=\(.value)"' | tr '\n' ' ' | sed 's/ $//')
          echo "extra_params=$extra_params" >> "$GITHUB_OUTPUT"

      - name: "Update KernelSU"
        if: ${{ env.withKernelSU == 'true' }}
        working-directory: ${{ github.workspace }}/${{ env.kernelDir }}/${{ env.kernelName }}
        shell: bash
        run: |
          if [ -d "./KernelSU" ]; then
            rm -rf "./KernelSU"
          fi
          if [ -d "./drivers/kernelsu" ]; then
            rm -rf "./drivers/kernelsu"
          fi

          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/main/kernel/setup.sh" | bash -s v3.3.0

          echo -e "\nCONFIG_KPROBES=y" >> "./arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"
          echo -e "\nCONFIG_HAVE_KPROBES=y" >> "./arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"
          echo -e "\nCONFIG_KPROBE_EVENTS=y" >> "./arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"

          cat "./arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"

      - name: "Make defconfig"
        working-directory: ${{ github.workspace }}/${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        shell: bash
        run: |
          echo "PATH Variable: $PATH"
          make ${args} ${{ env.DEFCONFIG_NAME }}

      - name: "Before Action"
        env:
          args: ${{ steps.generate-args.outputs.args }}
        working-directory: ${{ github.workspace }}/${{ env.kernelDir }}/${{ env.OUT_DIR }}
        shell: bash
        run: |
          echo "args ---> ${args}"
          echo "current path ---> $(pwd)"
          echo "CONFIG_OF_CONFIGFS=y" >> .config
          echo "CONFIG_OF_OVERLAY=y" >> .config
          cat .config

      - name: "Build kernel"
        working-directory: ${{ github.workspace }}/${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        shell: bash
        run: |
          echo "PATH Variable: $PATH"
          make ${args}

      - name: "Post Action"
        shell: bash
        run: |
          pwd
          find "./${{ env.kernelDir }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/" -type f

      - name: "Upload Image"
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ env.kernelDevice }}-${{ env.kernelName }}-${{ env.kernelBranch }}
          path: ./${{ env.kernelDir }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image
          if-no-files-found: ignore
          retention-days: 7

      - name: "Upload Image.gz"
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-${{ env.kernelDevice }}-${{ env.kernelName }}-${{ env.kernelBranch }}
          path: ./${{ env.kernelDir }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz
          if-no-files-found: ignore
          retention-days: 7

      - name: "Upload dtb"
        uses: actions/upload-artifact@v4
        with:
          name: dtb-${{ env.kernelDevice }}-${{ env.kernelName }}-${{ env.kernelBranch }}
          path: ./${{ env.kernelDir }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtb
          if-no-files-found: ignore
          retention-days: 7

      - name: "Upload dtbo.img"
        uses: actions/upload-artifact@v4
        with:
          name: dtbo.img-${{ env.kernelDevice }}-${{ env.kernelName }}-${{ env.kernelBranch }}
          path: ./${{ env.kernelDir }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtbo.img
          if-no-files-found: ignore
          retention-days: 7
