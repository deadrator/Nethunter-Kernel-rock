name: "SuiKernel rock (author builder)"

env:
  CONFIGURATION: "repos.json"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Set-repos:
    name: "Parse repos.json"
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.generate-matrix.outputs.repos }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Generate Matrix"
        id: generate-matrix
        shell: bash
        run: |
          {
            echo "repos<<EOF"
            cat "${{ env.CONFIGURATION }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  Build-Kernel:
    name: "Build ${{ matrix.repos.variant }}"
    runs-on: ubuntu-latest
    needs:
      - Set-repos
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        repos: ${{ fromJSON(needs.Set-repos.outputs.repos) }}
    env:
      VARIANT: ${{ matrix.repos.variant }}
      VARIANT_LABEL: ${{ matrix.repos.variant == 'nethunter' && 'gzip kernel, built-in rtl8188eus (TL-WN722N v2/v3 2357:010c), no mac80211/ath9k' || 'boot-safe (author parity, gzip kernel)' }}
      KERNEL_PIN: "287826cf842f01c75b8b256237d759d8bc92dd92"
      SUSFS_PIN: "6dc93089a0cedfec3d31739e747231f99d751e9e"
      KSU_PIN: "d575262c1b40180a0f915544f42d8c4ab34b874b"
      BUILDER_REPO: "https://github.com/deadrator/SuiKernel-GKI-Bulder"
      BUILDER_REF: "master"

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install prerequisites"
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/yarn.list
          sudo apt-get update -y
          sudo apt-get install -y bc cpio flex bison aptitude git python3 \
            python3-lxml tar perl wget curl lz4 zstd libarchive-tools aria2 zip unzip
          sudo aptitude install -y libssl-dev || sudo apt-get install -y libssl-dev

      - name: "Clone author builder + prepare for rock"
        shell: bash
        run: |
          git clone -q --depth=1 -b "${{ env.BUILDER_REF }}" "${{ env.BUILDER_REPO }}" builder
          python3 scripts/prepare_builder.py \
            --variant "${{ env.VARIANT }}" \
            --builder builder \
            --kernel-pin "${{ env.KERNEL_PIN }}" \
            --susfs-pin "${{ env.SUSFS_PIN }}" \
            --ksu-pin "${{ env.KSU_PIN }}"

          # Gate: config.sh now points at the forked kernel source
          grep -q 'KERNEL_REPO="https://github.com/deadrator/SuiKernel-android12-5.10"' builder/config.sh
          grep -q 'KERNEL_DEFCONFIG="gki_defconfig"' builder/config.sh
          grep -q 'CLANG_URL=.*clang-r416183b' builder/config.sh
          grep -q 'CLANG_BRANCH="11.0"' builder/config.sh
          # Gate: telegram reporting is disabled
          grep -q 'reply_file() { :; }' builder/functions.sh
          # Gate: nethunter variant vendors rtl8188eus built-in and does not
          # enable the mac80211/ath9k stack that bootlooped rock.
          if [ "${{ env.VARIANT }}" = "nethunter" ]; then
            grep -q 'config --enable CONFIG_RTL8188EU' builder/build.sh
            grep -q 'config --enable CONFIG_CFG80211' builder/build.sh
            grep -q 'config --disable CONFIG_MAC80211' builder/build.sh
            grep -q 'config --disable CONFIG_ATH9K_HTC' builder/build.sh
            grep -q '0x2357, 0x010c' builder/build.sh
          fi
          echo "Builder prepared: variant=${{ env.VARIANT }}"

      - name: "Run author build script (clones kernel, KSU-Next, SUSFS, builds, packs AK3)"
        working-directory: builder
        shell: bash
        run: |
          chmod +x *.sh
          export GIT_CLONE_PROTECTION_ACTIVE=false
          export STATUS=RELEASE
          export ROOT_METHOD=KernelSU-Next
          # Branch selection is config.sh's KERNEL_BRANCH_ENV passthrough;
          # suikernel-stable is the default and what we pin the kernel SHA on.
          ./build.sh
          test -f out/kernel.log || true

      - name: "Pack gzip kernel + rock installer (never lz4)"
        shell: bash
        run: |
          set -euo pipefail
          # Author zip ships an uncompressed Image. On device, magiskboot
          # repack then compresses that Image with the stock kernel format,
          # which is lz4 — and an lz4 kernel bootloops rock after the write
          # succeeds. pack_rock_ak3.sh replaces it with Image.gz and an
          # installer that refuses to flash lz4 and does not recompress the
          # stock lz4-legacy ramdisk.
          ZIP=$(ls builder/artifacts/*.zip | head -n 1)
          test -n "$ZIP" || { echo "FATAL: no AK3 zip produced"; exit 1; }
          chmod +x scripts/pack_rock_ak3.sh
          scripts/pack_rock_ak3.sh "$ZIP" installer/anykernel.sh "$ZIP"
          echo "AK3ZIP=$(basename "$ZIP")" >> "$GITHUB_ENV"
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "ZIP at: $(basename "$ZIP")"

      - name: "Upload AK3 flashable zip"
        uses: actions/upload-artifact@v4
        with:
          name: AK3-rock-${{ env.VARIANT }}-${{ github.run_number }}
          path: |
            builder/artifacts/*.zip
            builder/artifacts/*.zip.sha256
          if-no-files-found: error
          retention-days: 7

      - name: "Upload build log"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildlog-rock-${{ env.VARIANT }}-${{ github.run_number }}
          path: builder/build.log
          if-no-files-found: error
          retention-days: 7

      - name: "Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rock-${{ github.run_number }}-${{ env.VARIANT }}
          name: SuiKernel rock build ${{ github.run_number }} ${{ env.VARIANT == 'safe' && '(boot-safe, author-parity)' || '(NetHunter WiFi)' }}
          body: |
            SuiKernel for rock (Poco M5 / Redmi 11 Prime 5G) - GKI android12-5.10
            Built with the author's SuiKernel-GKI-Bulder pipeline (forks, pinned).

            - Variant: **${{ env.VARIANT }}** - ${{ env.VARIANT_LABEL }}
            - Kernel: deadrator/SuiKernel-android12-5.10 @ ${{ env.KERNEL_PIN }} (suikernel-stable)
            - KernelSU-Next (pershoot dev-susfs @ ${{ env.KSU_PIN }}) + SUSFS (@ ${{ env.SUSFS_PIN }})
            - Defconfig: gki_defconfig - HID gadget (CONFIG_USB_CONFIGFS_F_HID) + RNDIS/ECM built in
            - Kernel compression: **gzip only**. The installer aborts if the packed kernel is lz4.
            - Ramdisk: stock lz4-legacy bytes copied through. Not recompressed.

            ${{ env.VARIANT == 'nethunter' && '**TL-WN722N v2/v3**: aircrack-ng rtl8188eus is built into the kernel (`CONFIG_RTL8188EU=y`) and already knows USB id `2357:010c`. Plug the adapter in (OTG). No insmod. mac80211 and ath9k_htc are not enabled.' || 'No wireless config changes - parity with the upstream SuiKernel builds, plus the gzip installer.' }}

            **Install**: flash the zip in Kernel Flasher or recovery. Boot partition only - stock ramdisk, dtbo, vbmeta untouched. If this build still bootloops, flash the matching `safe` zip from the same run to get back in.
          files: |
            builder/artifacts/*.zip
            builder/artifacts/*.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
