name: "Build kernels"

env:
  CONFIGURATION: "repos.json"
  OUT_DIR: "out"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Set-repos:
    name: "Parse repos.json"
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.generate-matrix.outputs.repos }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Generate Matrix"
        id: generate-matrix
        shell: bash
        run: |
          {
            echo "repos<<EOF"
            cat "${{ env.CONFIGURATION }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  Build-Kernel:
    name: "Build kernel"
    runs-on: ubuntu-latest
    needs:
      - Set-repos
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        repos: ${{ fromJSON(needs.Set-repos.outputs.repos) }}
    env:
      kernelDir: ${{ format('{0}_{1}', matrix.repos.kernelSource.name, matrix.repos.kernelSource.device) }}
      kernelName: ${{ matrix.repos.kernelSource.name }}
      kernelRepo: ${{ matrix.repos.kernelSource.repo }}
      kernelBranch: ${{ matrix.repos.kernelSource.branch }}
      kernelDevice: ${{ matrix.repos.kernelSource.device }}
      DEFCONFIG_NAME: ${{ matrix.repos.defconfig }}
      withKernelSU: ${{ matrix.repos.withKernelSU }}
      ARCH_BOOT: arm64

    steps:
      - name: "Create working dir"
        shell: bash
        run: mkdir -p "${{ env.kernelDir }}"

      - name: "Install prerequisites"
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc curl git zip ftp gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev lftp zstd wget libfl-dev python3 python-is-python3 libarchive-tools cpio flex bison

      - name: "Clone kernel source"
        working-directory: ${{ github.workspace }}/${{ env.kernelDir }}
        shell: bash
        run: |
          git clone --recursive --branch "${{ env.kernelBranch }}" "${{ env.kernelRepo }}" "${{ env.kernelName }}" --depth=1

      - name: "Get toolchains"
        working-directory: ${{ github.workspace }}/${{ env.kernelDir }}
        shell: bash
        env:
          toolchains: ${{ toJSON(matrix.repos.toolchains) }}
        run: |
          mkdir -p toolchains
          echo "$toolchains" | jq -c '.[]' | while read -r tc; do
            repo=$(echo "$tc" | jq -r '.repo')
            branch=$(echo "$tc" | jq -r '.branch // empty')
            name=$(echo "$tc" | jq -r '.name')
            if [ -n "$branch" ]; then
              git clone --depth=1 --branch "$branch" "$repo" "toolchains/$name"
            else
              git clone --depth=1 "$repo" "toolchains/$name"
            fi
            # Toolchain layouts differ: proton-clang has bin/ at the repo root,
            # AOSP prebuilts nest it under clang-rXXXXXX/bin. Register every
            # bin dir found so the compilers/linkers land on PATH.
            find "$(pwd)/toolchains/$name" -maxdepth 3 -type d -name bin | while read -r binDir; do
              echo "$binDir" >> "$GITHUB_PATH"
              echo "PATH += $binDir"
            done
          done

      - name: "Set args"
        id: generate-args
        working-directory: ${{ github.workspace }}/${{ env.kernelDir }}/${{ env.kernelName }}
        shell: bash
        env:
          params: ${{ toJSON(matrix.repos.params) }}
        run: |
          get_param() { echo "$params" | jq -r --arg k "$1" '.[$k] // empty'; }

          args="-j$(nproc --all)"
          if [ -n "${{ env.OUT_DIR }}" ]; then
            mkdir -p "$(pwd)/${{ env.OUT_DIR }}"
            args="${args} O=$(pwd)/${{ env.OUT_DIR }}"
          fi

          # Emit every parameter as VAR=value on the make command line.
          # Array-valued params (e.g. LLVM) expand to multiple tokens.
          for key in $(echo "$params" | jq -r 'keys[]'); do
            val=$(get_param "$key")
            [ -n "$val" ] || continue
            if echo "$val" | jq empty >/dev/null 2>&1; then
              for item in $(echo "$val" | jq -r '.[]'); do
                args="${args} ${key}=${item}"
              done
            else
              args="${args} ${key}=${val}"
            fi
          done

          echo "args=${args}" >> "$GITHUB_OUTPUT"
          echo "Final make args: ${args}"

      - name: "Update KernelSU"
        if: ${{ env.withKernelSU == 'true' }}
        working-directory: ${{ github.workspace }}/${{ env.kernelDir }}/${{ env.kernelName }}
        shell: bash
        run: |
          if [ -d "./KernelSU" ]; then
            rm -rf "./KernelSU"
          fi
          if [ -d "./drivers/kernelsu" ]; then
            rm -rf "./drivers/kernelsu"
          fi

          # KernelSU-Next susfs fork - the variant the kernel author's own
          # pipeline installs for this tree (SuiKernel-GKI-Bulder:
          # install_ksu pershoot/KernelSU-Next dev-susfs)
          curl -fLSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" -o ksu_setup.sh
          bash ksu_setup.sh dev-susfs
          rm -f ksu_setup.sh

          ls -la ./drivers/kernelsu || true
          # Verify the KernelSU driver is actually wired into the tree.
          grep -q "config KSU" ./drivers/kernelsu/Kconfig
          echo "KernelSU-Next (pershoot dev-susfs) wired into drivers/kernelsu"

          log() { echo "[LOG] $*"; }
          error() { echo "[ERROR] $*" >&2; exit 1; }

          # SELinux rule injections for the tree's Yamada drivers
          # (author's selinux.sh, injected into the KSU driver's rules.c)
          curl -fLSs "https://raw.githubusercontent.com/LoggingNewMemory/SuiKernel-GKI-Bulder/master/selinux.sh" -o selinux.sh
          source ./selinux.sh
          grep -q 'ksu_allow(db, "kernel", "sysfs_leds"' drivers/kernelsu/selinux/rules.c
          echo "SELinux rules injected"
          rm -f selinux.sh

          # Pavolia Reine property-injector integration: provides
          # ksu_pavolia_add_prop(), required to link drivers/Yamada/*.c.
          # Runs the author's official patch script verbatim (dry-run tested
          # against the fork's ksud_integration.c), then hard-verifies.
          curl -fLSs "https://raw.githubusercontent.com/LoggingNewMemory/SuiKernel-GKI-Bulder/master/PavoliaReinePatch.sh" -o PavoliaReinePatch.sh
          source ./PavoliaReinePatch.sh
          KSUD=drivers/kernelsu/runtime/ksud_integration.c
          grep -q "void ksu_pavolia_add_prop" "$KSUD"
          grep -q "EXPORT_SYMBOL(ksu_pavolia_add_prop)" "$KSUD"
          [ "$(grep -c 'append_pavolia_rc:' "$KSUD")" -eq 2 ]
          [ "$(grep -c 'goto append_pavolia_rc' "$KSUD")" -eq 2 ]
          grep -q "size_t extra = ksu_rc_len + module_rc_len + pavolia_rc_len;" "$KSUD"
          echo "Pavolia Reine KSU integration applied and verified"
          rm -f PavoliaReinePatch.sh

          # SUSFS kernel-side patches: the actual implementation of the
          # CONFIG_KSU_SUSFS* options already present in gki_defconfig
          rm -rf ./susfs
          git clone --depth=1 -q https://gitlab.com/simonpunk/susfs4ksu -b gki-android12-5.10 ./susfs
          SUSFS_PATCHES=./susfs/kernel_patches
          cp -R "$SUSFS_PATCHES"/fs/* ./fs/
          cp -R "$SUSFS_PATCHES"/include/* ./include/
          patch -p1 < "$SUSFS_PATCHES"/50_add_susfs_in_gki-android12-5.10.patch || echo "WARNING: susfs patch applied with fuzz or partial failure"
          test -f ./fs/susfs.c
          test -f ./include/linux/susfs.h

          # Author's post-patch fixups: move the statfs extern below internal.h
          # and pull security.h into susfs.c
          python3 - <<'PYEOF'
          with open("./fs/statfs.c") as f:
              data = f.read()
          data = data.replace("extern int susfs_sus_kstat_spoof_vfs_statfs(struct inode *inode, struct kstatfs *buf, bool *is_fuse);", "")
          data = data.replace('#include "internal.h"', '#include "internal.h"\nextern int susfs_sus_kstat_spoof_vfs_statfs(struct inode *inode, struct kstatfs *buf, bool *is_fuse);')
          with open("./fs/statfs.c", "w") as f:
              f.write(data)

          with open("./fs/susfs.c") as f:
              data2 = f.read()
          data2 = data2.replace("#include <linux/fs.h>", "#include <linux/fs.h>\n#include <linux/security.h>")
          with open("./fs/susfs.c", "w") as f:
              f.write(data2)
          print("susfs fixups applied")
          PYEOF
          grep -q "susfs_sus_kstat_spoof_vfs_statfs" ./fs/statfs.c
          grep -q "#include <linux/security.h>" ./fs/susfs.c
          echo "SUSFS patches applied and verified"

      - name: "Make defconfig"
        working-directory: ${{ github.workspace }}/${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        shell: bash
        run: |
          command -v clang || { echo "FATAL: clang not on PATH"; ls -R ../toolchains | head -40; exit 1; }
          command -v ld.lld || { echo "FATAL: ld.lld not on PATH"; ls -R ../toolchains | head -40; exit 1; }

          # Author's config tweaks, applied to the defconfig file itself so
          # they survive `make defconfig` (mirrors SuiKernel-GKI-Bulder)
          DEFCONFIG_FILE=$(find ./arch/arm64/configs -name "${{ env.DEFCONFIG_NAME }}")
          scripts/config --file "$DEFCONFIG_FILE" \
            --enable CONFIG_KSU \
            --disable CONFIG_KSU_MANUAL_SU \
            --enable CONFIG_KSU_SUSFS \
            --set-str CONFIG_LOCALVERSION "-SuiKernel-Stable-KernelSU-Next" \
            --disable CONFIG_LOCALVERSION_AUTO

          # NetHunter external Wi-Fi support: cfg80211/mac80211 core (required
          # by out-of-tree rtl8188eus and ath9k_htc) plus the in-tree Atheros
          # HTC driver (TL-WN722N v1 / AR9271). The v2/v3 Realtek driver is
          # built as a module in a dedicated step below.
          scripts/config --file "$DEFCONFIG_FILE" \
            --enable CONFIG_CFG80211 \
            --enable CONFIG_MAC80211 \
            --enable CONFIG_WLAN \
            --enable CONFIG_WLAN_VENDOR_ATH \
            --enable CONFIG_ATH9K_HTC
          touch .scmversion

          make ${args} ${{ env.DEFCONFIG_NAME }}
          grep -E "CONFIG_LOCALVERSION=|CONFIG_LTO|CONFIG_KPROBES|CONFIG_KSU=|CONFIG_KSU_SUSFS=" "${{ env.OUT_DIR }}/.config" || true

      - name: "Build kernel"
        working-directory: ${{ github.workspace }}/${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        shell: bash
        run: |
          set -o pipefail
          make ${args} 2>&1 | tail -n 120
          test -f "${{ env.OUT_DIR }}/arch/${{ env.ARCH_BOOT }}/boot/Image" || { echo "Image missing - build failed"; exit 1; }

      - name: "Build rtl8188eus module (TL-WN722N v2/v3)"
        working-directory: ${{ github.workspace }}/${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        shell: bash
        run: |
          # aircrack-ng rtl8188eus driver for Realtek RTL8188EUS dongles
          # (TP-Link TL-WN722N v2/v3). Built as an external module against the
          # just-built kernel tree; the module is packed into the AnyKernel
          # zip below (and uploaded as its own artifact). Android does not
          # auto-load external modules, so it is loaded with root via the
          # included load script or a manual insmod - same as the official
          # NetHunter kernel packages.
          git clone --depth=1 -b v5.3.9 https://github.com/aircrack-ng/rtl8188eus.git ../rtl8188eus

          # GKI exports filp_open/kernel_read inside a restricted VFS symbol
          # namespace; the rtl driver uses both, so it must import the
          # namespace or modpost rejects the module. MODULE_IMPORT_NS takes an
          # unquoted token on 5.10 kernels. Appended at file scope.
          RTL_INTC=../rtl8188eus/os_dep/linux/os_intfs.c
          test -f "$RTL_INTC"
          if ! grep -q "MODULE_IMPORT_NS" "$RTL_INTC"; then
            printf '\n/* GKI: import the restricted VFS namespace used by filp_open/kernel_read */\nMODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver);\n' >> "$RTL_INTC"
          fi
          grep -q "MODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver)" "$RTL_INTC"

          # Invoke straight through the kernel build system: the driver's own
          # Makefile has a KERNELRELEASE-gated kbuild section (obj-
          # $(CONFIG_RTL8188EU)), so M=<driver> is all the harness it needs.
          # O= is kept so kbuild resolves CONFIG_MODVERSIONS symbol CRCs from
          # out/Module.symvers of the kernel we just built.
          # CONFIG_RTL8188EU=m replaces the export done by its bare `make`
          # target, which we bypass.
          make ${args} M=$(pwd)/../rtl8188eus modules \
            KSRC=$(pwd) \
            USER_EXTRA_CFLAGS="-Wno-error" \
            CONFIG_RTL8188EU=m 2>&1 | tail -n 60
          MOD=$(find ../rtl8188eus -maxdepth 1 -name '*.ko' | head -1)
          test -n "$MOD" || { echo "FATAL: rtl8188eus .ko not produced"; exit 1; }
          echo "Built module: $MOD"
          mkdir -p ../modules_out
          cp "$MOD" ../modules_out/
          echo "RTLKO=$(basename "$MOD")" >> "$GITHUB_ENV"

      - name: "Assemble AnyKernel3 flashable zip"
        shell: bash
        run: |
          AK3="${{ env.kernelDir }}/AnyKernel3"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$AK3"
          rm -rf "$AK3/.git" "$AK3/.github" "$AK3/README.md" "$AK3/anykernel.sh"

          cp "${{ env.kernelDir }}/${{ env.kernelName }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH_BOOT }}/boot/Image" "$AK3/Image"

          DTB="${{ env.kernelDir }}/${{ env.kernelName }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH_BOOT }}/boot/dtb"
          if [ -f "$DTB" ]; then
            cp "$DTB" "$AK3/dtb"
          fi

          # Pack the rtl8188eus module (TL-WN722N v2/v3) into the zip
          if [ -d "${{ env.kernelDir }}/modules_out" ]; then
            mkdir -p "$AK3/modules/system/lib/modules"
            cp ${{ env.kernelDir }}/modules_out/*.ko "$AK3/modules/system/lib/modules/"
            cat > "$AK3/modules/system/lib/modules/load_nethunter_wifi.sh" <<'EOF'
          #!/system/bin/sh
          # Load the NetHunter external Wi-Fi driver (TL-WN722N v2/v3).
          # Requires root. Run from a root shell on the device:
          #   sh /system/lib/modules/load_nethunter_wifi.sh
          MODDIR=${0%/*}
          if ! grep -q cfg80211 /proc/modules 2>/dev/null; then
            echo "Note: cfg80211 is built into this kernel (not a module)"
          fi
          insmod "$MODDIR/8188eu.ko" && echo "8188eu loaded" || echo "insmod failed"
          ip link set wlan0 down 2>/dev/null
          echo "Adapter ready. Check: ip link  |  iw dev"
          EOF
            echo "rtl8188eus module packed into AnyKernel zip"
          fi

          cat > "$AK3/anykernel.sh" <<'EOF'
          # AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ## AnyKernel setup
          # global properties
          properties() { '
          kernel.string=SuiKernelNethunter-GKI-rock (KernelSU-Next + SUSFS + NetHunter WiFi)
          do.devicecheck=0
          # The 8188eu.ko is delivered via the rtl8188eus artifact / Stryker,
          # not the boot ramdisk: the rock boot image has no modifiable
          # ramdisk for the systemless overlay to land in.
          # NOTE: no apostrophes allowed anywhere in this properties block -
          # it is a single-quoted string (AK3 convention).
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=
          supported.versions=
          supported.patchlevels=
          '; } # end properties

          # boot files attributes
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          } # end attributes

          # boot shell variables
          BLOCK=auto;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install
          # GKI: boot holds only kernel+dtb (the generic ramdisk lives in
          # init_boot), so unpack without ramdisk handling, then repack+flash.
          # flash_boot skips the ramdisk-repack stage that write_boot runs
          # (there is no ramdisk to repack); write_boot alone repacked from a
          # split_img that never existed, the repack-abort failure seen on
          # device. No apostrophes in comments: this file must stay parseable
          # by the on-device mksh shell.
          split_boot;
          flash_boot;
          ## end boot install
          EOF

          # Parse-gate the generated installer at BUILD time, not on device
          bash -n "$AK3/anykernel.sh" || { echo "FATAL: generated anykernel.sh has a syntax error"; exit 1; }
          grep -q "split_boot" "$AK3/anykernel.sh" && grep -q "flash_boot" "$AK3/anykernel.sh"

          cd "$AK3"
          ZIPNAME="SuiKernelNethunter-rock-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../$ZIPNAME" .
          cd ../..
          cp "${{ env.kernelDir }}/$ZIPNAME" .
          sha256sum "$ZIPNAME" > "$ZIPNAME.sha256"
          echo "AK3ZIP=$ZIPNAME" >> "$GITHUB_ENV"

      - name: "Upload kernel Image"
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ env.kernelDevice }}-${{ env.kernelName }}-${{ env.kernelBranch }}
          path: ${{ env.kernelDir }}/${{ env.kernelName }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH_BOOT }}/boot/Image
          if-no-files-found: error
          retention-days: 7

      - name: "Upload Image.gz"
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-${{ env.kernelDevice }}-${{ env.kernelName }}-${{ env.kernelBranch }}
          path: ${{ env.kernelDir }}/${{ env.kernelName }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH_BOOT }}/boot/Image.gz
          if-no-files-found: ignore
          retention-days: 7

      - name: "Upload dtb"
        uses: actions/upload-artifact@v4
        with:
          name: dtb-${{ env.kernelDevice }}-${{ env.kernelName }}-${{ env.kernelBranch }}
          path: ${{ env.kernelDir }}/${{ env.kernelName }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH_BOOT }}/boot/dtb
          if-no-files-found: ignore
          retention-days: 7

      - name: "Upload rtl8188eus module"
        uses: actions/upload-artifact@v4
        with:
          name: rtl8188eus-${{ env.kernelDevice }}-${{ env.kernelName }}
          path: ${{ env.kernelDir }}/modules_out/*.ko
          if-no-files-found: error
          retention-days: 7

      - name: "Upload AnyKernel3 flashable zip"
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-${{ env.kernelDevice }}-${{ env.kernelName }}-${{ env.kernelBranch }}
          path: |
            ${{ env.AK3ZIP }}
            ${{ env.AK3ZIP }}.sha256
          if-no-files-found: error
          retention-days: 7

      - name: "Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rock-${{ github.run_number }}
          name: SuiKernelNethunter rock build ${{ github.run_number }}
          body: |
            Automated GKI build for rock (Poco M5 / Redmi 11 Prime 5G)
            - Kernel: ${{ env.kernelRepo }} (${{ env.kernelBranch }})
            - KernelSU-Next (pershoot dev-susfs fork) + SUSFS
            - NetHunter: HID gadget, RNDIS, mac80211 + ath9k_htc built-in, rtl8188eus module (TL-WN722N v2/v3)
            - Defconfig: ${{ env.DEFCONFIG_NAME }}

            **Install**: flash `AnyKernel3-*.zip` in recovery, or unpack and re-pack `Image` into your boot image.

            **External Wi-Fi (TL-WN722N v2/v3)**: grab `8188eu.ko` from the
            `rtl8188eus-rock-*` artifact, then from a root shell:
            `adb push 8188eu.ko /data/local/tmp/` and
            `insmod /data/local/tmp/8188eu.ko` (Stryker can manage the driver
            itself). Monitor mode: `iw dev wlanX set monitor none`.
          files: |
            ${{ env.AK3ZIP }}
            ${{ env.AK3ZIP }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
