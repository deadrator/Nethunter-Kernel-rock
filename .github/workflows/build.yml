name: "SuiKernel rock (author builder)"

env:
  CONFIGURATION: "repos.json"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Set-repos:
    name: "Parse repos.json"
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.generate-matrix.outputs.repos }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Generate Matrix"
        id: generate-matrix
        shell: bash
        run: |
          {
            echo "repos<<EOF"
            cat "${{ env.CONFIGURATION }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  Build-Kernel:
    name: "Build ${{ matrix.repos.variant }}"
    runs-on: ubuntu-latest
    needs:
      - Set-repos
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        repos: ${{ fromJSON(needs.Set-repos.outputs.repos) }}
    env:
      VARIANT: ${{ matrix.repos.variant }}
      VARIANT_LABEL: ${{ matrix.repos.variant == 'nethunter' && 'NetHunter WiFi (cfg80211/mac80211/ath9k_htc + rtl8188eus)' || 'boot-safe (author parity)' }}
      KERNEL_PIN: "287826cf842f01c75b8b256237d759d8bc92dd92"
      SUSFS_PIN: "6dc93089a0cedfec3d31739e747231f99d751e9e"
      KSU_PIN: "d575262c1b40180a0f915544f42d8c4ab34b874b"
      BUILDER_REPO: "https://github.com/deadrator/SuiKernel-GKI-Bulder"
      BUILDER_REF: "master"

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install prerequisites"
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/yarn.list
          sudo apt-get update -y
          sudo apt-get install -y bc cpio flex bison aptitude git python3 \
            python3-lxml tar perl wget curl lz4 zstd libarchive-tools aria2 zip unzip
          sudo aptitude install -y libssl-dev || sudo apt-get install -y libssl-dev

      - name: "Clone author builder + prepare for rock"
        shell: bash
        run: |
          git clone -q --depth=1 -b "${{ env.BUILDER_REF }}" "${{ env.BUILDER_REPO }}" builder
          python3 scripts/prepare_builder.py \
            --variant "${{ env.VARIANT }}" \
            --builder builder \
            --kernel-pin "${{ env.KERNEL_PIN }}" \
            --susfs-pin "${{ env.SUSFS_PIN }}" \
            --ksu-pin "${{ env.KSU_PIN }}"

          # Gate: config.sh now points at the forked kernel source
          grep -q 'KERNEL_REPO="https://github.com/deadrator/SuiKernel-android12-5.10"' builder/config.sh
          grep -q 'KERNEL_DEFCONFIG="gki_defconfig"' builder/config.sh
          grep -q 'CLANG_URL=.*clang-r416183b' builder/config.sh
          grep -q 'CLANG_BRANCH="11.0"' builder/config.sh
          # Gate: telegram reporting is disabled
          grep -q 'reply_file() { :; }' builder/functions.sh
          # Gate: nethunter variant injects the wireless stack
          if [ "${{ env.VARIANT }}" = "nethunter" ]; then
            grep -q 'CONFIG_ATH9K_HTC' builder/build.sh
            grep -q 'CONFIG_CFG80211' builder/build.sh
          fi
          echo "Builder prepared: variant=${{ env.VARIANT }}"

      - name: "Run author build script (clones kernel, KSU-Next, SUSFS, builds, packs AK3)"
        working-directory: builder
        shell: bash
        run: |
          chmod +x *.sh
          export GIT_CLONE_PROTECTION_ACTIVE=false
          export STATUS=RELEASE
          export ROOT_METHOD=KernelSU-Next
          # Branch selection is config.sh's KERNEL_BRANCH_ENV passthrough;
          # suikernel-stable is the default and what we pin the kernel SHA on.
          ./build.sh
          test -f out/kernel.log || true

      - name: "Locate artifacts + swap in rock installer"
        shell: bash
        run: |
          set -euo pipefail
          # The pack step copies the finished zip to builder/artifacts/
          ZIP=$(ls builder/artifacts/*.zip | head -n 1)
          test -n "$ZIP" || { echo "FATAL: no AK3 zip produced"; exit 1; }
          echo "AK3ZIP=$(basename "$ZIP")" >> "$GITHUB_ENV"

          # Repack the zip with a rock-adapted anykernel.sh:
          #  - GKI boot.img v4 on rock: kernel is gzip'd, ramdisk is
          #    lz4-legacy (02 21 4c 18) and lives INSIDE boot (no init_boot).
          #    split_boot+flash_boot re-flashes the kernel WITHOUT touching
          #    the ramdisk bytes -> no lz4 repack on device, exactly what
          #    the "lz4 won't boot" warning points at.
          #  - zeroed properties block (no kernel.string): the full 128-char
          #    cmdline in rock's stock v4 header cannot carry a second one.
          #  - do.modules=0 / do.systemless=0: nothing ships in the ramdisk.
          WORK=$(mktemp -d)
          unzip -q "$ZIP" -d "$WORK"
          rm -f "$WORK/anykernel.sh"
          cat > "$WORK/anykernel.sh" <<'ROKEOF'
          # AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers
          ## rock (Poco M5, GKI android12-5.10): kernel-only swap,
          ## ramdisk (lz4-legacy) passed through untouched.

          ## AnyKernel setup
          # global properties
          properties() { '
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          # boot files attributes
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $home/img/*;
          } # end attributes

          ## AnyKernel install
          ## boot shell variables
          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh

          ui_print " "
          ui_print "SuiKernel rock - KernelSU-Next + SUSFS"
          ui_print "Kernel-only flash: ramdisk untouched"
          ui_print " "

          # GKI boot: kernel + dtb, vendor ramdisk inside boot (no init_boot).
          # split_boot + flash_boot = no mkbootfs/lz4 repack of the ramdisk.
          split_boot
          flash_boot
          ROKEOF
          # Parse-gate the installer at BUILD time, not on device
          bash -n "$WORK/anykernel.sh" || { echo "FATAL: generated anykernel.sh has a syntax error"; exit 1; }
          grep -q "split_boot" "$WORK/anykernel.sh" && grep -q "flash_boot" "$WORK/anykernel.sh"

          zip -q -9 -j "$ZIP" "$WORK/anykernel.sh"
          rm -rf "$WORK"

          cp "$ZIP" .
          sha256sum "$(basename "$ZIP")" > "builder/artifacts/$(basename "$ZIP").sha256"
          echo "ZIP at: $(basename "$ZIP")"

      - name: "Build rtl8188eus module (TL-WN722N v2/v3) [nethunter only]"
        if: ${{ matrix.repos.variant == 'nethunter' }}
        shell: bash
        run: |
          set -euo pipefail
          cd builder/ksrc
          # aircrack-ng rtl8188eus driver for Realtek RTL8188EUS dongles
          # (TP-Link TL-WN722N v2/v3). Built against the exact kernel that
          # ships it (MODVERSIONS CRCs must match). Loaded manually or via
          # Stryker - not packed into the AK3 zip (kernel-only flash).
          git clone --depth=1 -b v5.3.9 https://github.com/aircrack-ng/rtl8188eus.git ../rtl8188eus

          # GKI restricts filp_open/kernel_read behind a VFS symbol namespace;
          # the rtl driver must import it or modpost rejects the module.
          # (5.10 macro takes a bare token - no quotes.)
          RTL_INTC=../rtl8188eus/os_dep/linux/os_intfs.c
          test -f "$RTL_INTC"
          if ! grep -q "MODULE_IMPORT_NS" "$RTL_INTC"; then
            printf '\n/* GKI: import the restricted VFS namespace used by filp_open/kernel_read */\nMODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver);\n' >> "$RTL_INTC"
          fi
          grep -q "MODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver)" "$RTL_INTC"

          # Author-parity build flags; O= kept for symbol CRC resolution.
          CLANGDIR=$(pwd)/../clang
          GCCDIR=$(pwd)/../gcc
          if [ -d "$GCCDIR/bin" ]; then
            export PATH="$CLANGDIR/bin:$GCCDIR/bin:$PATH"
            P="aarch64-linux-"
          else
            export PATH="$CLANGDIR/bin:$PATH"
            P="aarch64-linux-gnu-"
          fi
          FLAGS="-j$(nproc --all) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out CROSS_COMPILE=$P"
          make $FLAGS M=$(pwd)/../rtl8188eus modules \
            KSRC=$(pwd) \
            USER_EXTRA_CFLAGS="-Wno-error" \
            CONFIG_RTL8188EU=m 2>&1 | tail -n 60
          MOD=$(find ../rtl8188eus -maxdepth 1 -name '*.ko' | head -1)
          test -n "$MOD" || { echo "FATAL: rtl8188eus .ko not produced"; exit 1; }
          mkdir -p ../artifacts
          cp "$MOD" ../artifacts/
          echo "Built module: $(basename "$MOD")"

      - name: "Upload AK3 flashable zip"
        uses: actions/upload-artifact@v4
        with:
          name: AK3-rock-${{ env.VARIANT }}-${{ github.run_number }}
          path: |
            builder/artifacts/*.zip
            builder/artifacts/*.zip.sha256
          if-no-files-found: error
          retention-days: 7

      - name: "Upload rtl8188eus module"
        if: ${{ matrix.repos.variant == 'nethunter' }}
        uses: actions/upload-artifact@v4
        with:
          name: rtl8188eus-rock-${{ github.run_number }}
          path: builder/artifacts/*.ko
          if-no-files-found: error
          retention-days: 7

      - name: "Upload build log"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildlog-rock-${{ env.VARIANT }}-${{ github.run_number }}
          path: builder/build.log
          if-no-files-found: error
          retention-days: 7

      - name: "Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rock-${{ github.run_number }}-${{ env.VARIANT }}
          name: SuiKernel rock build ${{ github.run_number }} ${{ env.VARIANT == 'safe' && '(boot-safe, author-parity)' || '(NetHunter WiFi)' }}
          body: |
            SuiKernel for rock (Poco M5 / Redmi 11 Prime 5G) - GKI android12-5.10
            Built with the author's SuiKernel-GKI-Bulder pipeline (forks, pinned).

            - Variant: **${{ env.VARIANT }}** - ${{ env.VARIANT_LABEL }}
            - Kernel: deadrator/SuiKernel-android12-5.10 @ ${{ env.KERNEL_PIN }} (suikernel-stable)
            - KernelSU-Next (pershoot dev-susfs @ ${{ env.KSU_PIN }}) + SUSFS (@ ${{ env.SUSFS_PIN }})
            - Defconfig: gki_defconfig - HID gadget (CONFIG_USB_CONFIGFS_F_HID) + RNDIS/ECM built in
            - Installer: kernel-only (split_boot + flash_boot) - stock lz4 ramdisk untouched

            ${{ env.VARIANT == 'nethunter' && '**NetHunter Wi-Fi**: cfg80211/mac80211/ath9k_htc are built into the kernel. For the TL-WN722N v2/v3 grab `8188eu.ko` from the artifacts, then: `adb push 8188eu.ko /data/local/tmp/` + `insmod /data/local/tmp/8188eu.ko` (Stryker can manage the driver itself). Monitor mode: `iw dev wlanX set monitor none`.' || 'No wireless config changes - parity with the upstream SuiKernel builds.' }}

            **Install**: flash `SuiKernel-rock-*.zip` in recovery (or via the author's flash_kernel.sh with root). Boot partition only - stock ramdisk, dtbo, vbmeta untouched.
          files: |
            builder/artifacts/*.zip
            builder/artifacts/*.zip.sha256
            builder/artifacts/*.ko
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
